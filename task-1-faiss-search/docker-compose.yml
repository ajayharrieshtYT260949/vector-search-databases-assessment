
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vector-search-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: vector_db
      POSTGRES_USER: vector_user
      POSTGRES_PASSWORD: vector_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U vector_user -d vector_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
